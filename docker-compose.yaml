services: 
  mysql: 
    image: mysql:latest
    container_name: mysql
    ports: 
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: swiggyclone

  backend: 
    build: ./backend
    container_name: backend
    ports: 
      - "8000:8000"

  frontend: 
    build: ./frontend
    container_name: frontend
    ports: 
      - "3000:3000"
    environment:
      DATABASE: "mysql://root:password123@mysql:3306/swiggyclone"
    depends_on:
      - mysql
